/* Layout: an 8-bit market terminal — pixel-notched panels on a navy grid, gold as the single accent, CJK body kept smooth for reading */
:root{
  --bg:#081230; --bg2:#0C1A42; --surface:#11235A; --surface2:#172D6E; --line:#2B4590; --line-hi:#3F5DB3;

}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.8;margin:0;
  background-image:linear-gradient(rgba(63,93,179,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(63,93,179,.10) 1px,transparent 1px);
  background-size:32px 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:var(--px) solid var(--gold);outline-offset:2px}
::selection{background:var(--gold);color:var(--gold-ink)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.px-gold{box-shadow:0 calc(-1*var(--px)) 0 0 var(--gold),0 var(--px) 0 0 var(--gold),calc(-1*var(--px)) 0 0 0 var(--gold),var(--px) 0 0 0 var(--gold),
  calc(2*var(--px)) calc(3*var(--px)) 0 0 var(--shadow)}

.empty{padding:44px 24px;text-align:center;color:var(--muted)}

.empty .px-coin{width:40px;height:40px;margin:0 auto 14px;display:block;shape-rendering:crispEdges}

/* article */
.article{max-width:740px;margin:0 auto}
.back{font-family:var(--font-pixel);font-size:13px;color:var(--muted);text-decoration:none;display:block;width:max-content;margin-bottom:22px}

.drafts{display:grid;gap:4px}

<script>
(() => {
const DISC = "本文仅供参考及教育用途，并不构成任何买卖建议。投资者在作出任何投资决定前，应细阅相关资料并自行判断。投资涉及风险，请谨慎。";
const S = { posts: [], loaded: false, failed: false, cat: "全部", q: "", lang: "en" };
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const safeSrc = p => /^img\/[A-Za-z0-9._-]+$/.test(p || "") ? p : "";
const fmtDate = iso => { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? "" : `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; };
const toast = m => { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); };

/* ---------- body markup ---------- */
function inline(t){ return esc(t).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>"); }
function render(body){
  const lines = String(body || "").replace(/\r/g, "").split("\n");
  const out = []; let para = [], ol = [], call = [];
  const flush = () => {
    if (para.length){ out.push("<p>" + inline(para.join("")) + "</p>"); para = []; }
    if (ol.length){ out.push("<ol>" + ol.map(x => "<li>" + inline(x) + "</li>").join("") + "</ol>"); ol = []; }
    if (call.length){ out.push('<div class="callout">' + call.map(x => "<p>" + inline(x) + "</p>").join("") + "</div>"); call = []; }
  };
  for (const raw of lines){
    const l = raw.trim();
    let m;
    if (!l){ flush(); continue; }
    if ((m = l.match(/^!\[(.*?)\]\((img\/[A-Za-z0-9._-]+)\)$/))){ flush(); out.push(`<figure><img src="${safeSrc(m[2])}" alt="${esc(m[1] || "图表")}" loading="lazy">${m[1] ? `<figcaption>${esc(m[1])}</figcaption>` : ""}</figure>`); continue; }
    if (l === "---"){ flush(); out.push("<hr>"); continue; }
    if ((m = l.match(/^##\s+(.*)/))){ flush(); out.push("<h2>" + inline(m[1]) + "</h2>"); continue; }
    if ((m = l.match(/^>\s?(.*)/))){ if (para.length || ol.length){ const c = call; call = []; flush(); call = c; } call.push(m[1]); continue; }
    if ((m = l.match(/^\d+[.、]\s*(.*)/))){ if (para.length || call.length){ const o = ol; ol = []; flush(); ol = o; } ol.push(m[1]); continue; }
    if (call.length || ol.length) flush();
    para.push(l);
  }
  flush();
  return out.join("");
}
function plain(p){
  const facts = (p.keyFacts || []).map(f => `${f.k}：${f.v}`).join("\n");
  const body = String(p.body || "").split("\n").map(l => {
    const t = l.trim();
    if (/^!\[.*\]\(img\//.test(t)) return null;
    if (t === "---") return "";
    return t.replace(/^##\s+/, "").replace(/^>\s?/, "").replace(/\*\*/g, "");
  }).filter(x => x !== null).join("\n").replace(/\n{3,}/g, "\n\n");
  const tags = (p.tags || []).map(t => "#" + t).join(" ");
  return [p.title, facts, body.trim(), "免责声明：" + DISC, tags].filter(Boolean).join("\n\n");
}

/* ---------- views ---------- */
function coverHTML(p){
  const src = safeSrc(p.cover);
  return src ? `<img src="${src}" alt="" loading="lazy">` : `<div class="noimg">${esc(p.category || "12INVEST")}</div>`;
}
function visible(){
  const q = S.q.trim().toLowerCase();
  return S.posts.filter(p => (S.cat === "全部" || p.category === S.cat) &&
    (!q || [p.title, p.excerpt, (p.tags||[]).join(" ")].join(" ").toLowerCase().includes(q)));
}
function glanceHTML(p){
  const g = p.glance || {};
  const stats = (g.stats && g.stats.length ? g.stats : (p.keyFacts || []).slice(0, 4)).filter(s => s.k && s.v);
  const list = (arr, cls, label) => arr && arr.length ? `<div class="gcol ${cls}"><div class="glabel">${label}</div><ul>${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
  const href = `#p-${esc(p.id)}`;
  return `<article class="glance px">
    <a class="gcover" href="${href}" tabindex="-1" aria-hidden="true">${coverHTML(p)}</a>
    <div class="gbody">
      <div class="gtop"><span class="cat">【${esc(p.category)}】</span><span class="meta"><span>${fmtDate(p.publishedAt)}</span></span></div>
      <h2 class="gtitle"><a href="${href}">${esc(p.title)}</a></h2>
      ${stats.length ? `<dl class="gstats">${stats.map(s => `<div class="gstat"><dt>${esc(s.k)}</dt><dd>${esc(s.v)}</dd></div>`).join("")}</dl>` : ""}
      ${(g.pros || g.watch) ? `<div class="gcols">${list(g.pros, "pros", "亮点")}${list(g.watch, "watch", "留意")}</div>` : `<p class="gex">${esc(p.excerpt)}</p>`}
      <div class="gfoot">${g.timeline ? `<span class="gtime">${esc(g.timeline)}</span>` : "<span></span>"}<a class="btn primary" href="${href}">阅读全文 →</a></div>
    </div>
  </article>`;
}
function viewHome(){
  const cats = ["全部", ...[...new Set(S.posts.map(p => p.category).filter(Boolean))]];
  const list = visible();
  let html = `<div class="filters">${cats.map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===S.cat}">${esc(c)}</button>`).join("")}
    <input class="search" id="q" type="search" placeholder="搜索公司、主题…" value="${esc(S.q)}" aria-label="搜索文章"></div>`;
  if (!S.loaded) html += `<div class="empty px"><h3>正在载入文章</h3>稍等片刻<span class="blink">_</span></div>`;
  else if (S.failed) html += `<div class="empty px"><h3>文章暂时载入不了</h3>请刷新页面再试一次。</div>`;
  else if (!S.posts.length) html += `<div class="empty px"><h3>还没有发布文章</h3>第一篇文章发布后会出现在这里。</div>`;
  else if (!list.length) html += `<div class="empty px"><h3>没有符合的文章</h3>换个关键词或分类试试。</div>`;
  else {
    html += `<div class="sec">一眼看懂 · ${list.length} 篇</div><div class="glances">${list.map(glanceHTML).join("")}</div>`;
  }
  app.innerHTML = html;
  app.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { S.cat = b.dataset.cat; viewHome(); });
  const q = $("#q"); if (q) q.oninput = e => { S.q = e.target.value; const pos = e.target.selectionStart; viewHome(); const n = $("#q"); n.focus(); n.setSelectionRange(pos,pos); };
  setTape();
}
/* key facts: single-column spec sheet so every label and value lines up */
function factsHTML(facts){
  return `<dl class="facts"><div class="hd">关键资料<span>KEY FACTS</span></div>${facts.map(f =>
    `<div class="fact"><dt>${esc(f.k)}</dt><dd>${esc(f.v)}</dd></div>`).join("")}</dl>`;
}
function articleHTML(p){
  const facts = (p.keyFacts || []).filter(f => f.k && f.v);
  return `<article class="article">
    <a class="back" href="#home">← 返回所有文章</a>
    <div class="cat">【${esc(p.category || "未分类")}】</div>
    <h1>${esc(p.title)}</h1>
    <div class="meta"><span>${fmtDate(p.publishedAt)}</span><span>12Invest</span></div>
    ${facts.length ? factsHTML(facts) : ""}
    <div class="body">${render(p.body)}</div>
    <p class="disc"><strong>免责声明：</strong>${DISC}</p>
    ${(p.tags||[]).length ? `<div class="tags">${p.tags.map(t => `<span>#${esc(t)}</span>`).join("")}</div>` : ""}
  </article>`;
}
function viewPost(id){
  const p = S.posts.find(x => x.id === id);
  if (!p){ app.innerHTML = S.loaded ? `<div class="empty px"><h3>找不到这篇文章</h3><a href="#home">返回所有文章</a></div>` : `<div class="empty px"><h3>正在载入文章</h3>稍等片刻<span class="blink">_</span></div>`; return; }
  const txt = plain(p);
  app.innerHTML = articleHTML(p) + `<div class="article"><div class="tools">
      <button class="btn" id="copy">复制全文</button>
      <span class="note">${txt.length.toLocaleString()} 字符 · 纯文字，可直接分享</span></div>
      <textarea id="copysrc" hidden readonly>${esc(txt)}</textarea></div>`;
  $("#copy").onclick = () => copyText(txt);
  setTape(p);
  document.title = p.title + " · 12Invest";
  window.scrollTo(0, 0);
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); toast("已复制全文"); }
  catch { const ta = $("#copysrc"); ta.hidden = false; ta.style.width = "100%"; ta.style.minHeight = "160px"; ta.select(); toast("已选取全文，请按复制"); }
}
function setTape(p){
  const items = p ? (p.keyFacts || []).filter(f=>f.k&&f.v).map(f => `<span><i>&gt;</i>${esc(f.k)} ${esc(f.v)}</span>`)
                  : S.posts.slice(0, 6).map(x => `<span><i>&gt;</i>${esc(x.category)} · ${esc(String(x.title).replace(/^【.*?】\s*/, "").slice(0, 26))}</span>`);
  $("#tape").innerHTML = items.length ? items.join("") : `<span><i>&gt;</i>马股新股与上市公司解读</span>`;
}

function viewLegal(key){
  const doc = LEGAL[key], L = S.lang === "bm" ? "bm" : "en", d = doc[L];
  const other = Object.keys(LEGAL).filter(k => k !== key);
  app.innerHTML = `<article class="article legal">
    <a class="back" href="#home">← 返回首页</a>
    <div class="langs" role="group" aria-label="Language">
      <button class="chip" data-lang="en" aria-pressed="${L==="en"}">English</button>
      <button class="chip" data-lang="bm" aria-pressed="${L==="bm"}">Bahasa Malaysia</button>
    </div>
    <div class="cat">${esc(doc.zh)}</div>
    <h1>${esc(d.title)}</h1>
    <div class="meta"><span>${esc(d.sub)}</span><span>${esc(UPDATED[L])}</span></div>
    <div class="body">
      ${d.s.map(([h, p], i) => `<h2>${i + 1}. ${esc(h)}</h2><p>${esc(p)}</p>`).join("")}
      <h2>${L === "bm" ? "Hubungi kami" : "Contact us"}</h2>
      <p>${esc(PUB[L])}</p>
      <div class="callout"><p>${L === "bm" ? "E-mel" : "Email"}: <strong class="sel">${esc(CONTACT)}</strong></p></div>
    </div>
    <div class="tools">${other.map(k => `<a class="btn" href="#${k}">${esc(LEGAL[k].zh)} · ${esc(LEGAL[k][L].title)}</a>`).join("")}</div>
  </article>`;
  app.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { S.lang = b.dataset.lang; viewLegal(key); });
  document.title = d.title + " · 12Invest";
  setTape();
  window.scrollTo(0, 0);
}


/* ---------- routing ---------- */
function route(){
  const h = location.hash.slice(1);
  document.title = "12Invest";
  if (h.startsWith("p-")) return viewPost(h.slice(2));
  if (LEGAL[h]) return viewLegal(h);
  viewHome();
}
window.addEventListener("hashchange", route);

/* ---------- data: posts.json is published with the page ---------- */
route();
fetch("posts.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    S.posts = (Array.isArray(d.posts) ? d.posts : []).filter(p => p && p.id && p.title)
      .sort((a, b) => String(b.publishedAt).localeCompare(String(a.publishedAt)));
    S.loaded = true; route();
  })
  .catch(() => { S.loaded = true; S.failed = true; route(); });
})();
</script>
