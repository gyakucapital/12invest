# Rebuilds the site whenever content or tools change on main (so an article can be published by editing
# posts.json in GitHub's web editor), deploys it to GitHub Pages ONCE per run (with one retry),
# then posts any new article / news edition to the 12Invest Telegram channel.
# Needs Settings → Pages → Build and deployment → Source = "GitHub Actions"; until that is switched,
# the deploy steps are skipped harmlessly and GitHub's own per-push deployment keeps serving the site.
name: Build site
on:
  push:
    branches: [main]
    paths: ["posts.json", "data/**", "img/**", "tools/**", "assets/**", "fonts/**"]
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Send a test message to the Telegram channel"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: build, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tools
        run: |
          pip install pillow
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Charts, share images, WebP copies
        run: |
          node tools/charts.mjs
          node tools/og.mjs
          python3 tools/images.py
      - name: Build pages
        run: node tools/build.mjs
      - name: Publish generated files
        run: |
          git config user.name "12Invest"
          git config user.email "kyzen@gyakucapital.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Build site [automated]" && git push)
      - name: Package site for Pages
        run: |
          rm -rf node_modules
          git pull --rebase -q || true
      - name: Check Pages source
        id: src
        env: { GH_TOKEN: "${{ github.token }}" }
        run: echo "mode=$(gh api repos/${{ github.repository }}/pages --jq .build_type 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        id: pages
        if: steps.src.outputs.mode == 'workflow'
      - uses: actions/upload-pages-artifact@v3
        if: steps.src.outputs.mode == 'workflow'
        with: { path: "." }
      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.src.outputs.mode == 'workflow'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with: { timeout: 900000 }
      - name: Deploy to GitHub Pages (retry)
        id: deploy2
        if: steps.src.outputs.mode == 'workflow' && steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with: { timeout: 900000 }
      - name: Post new articles to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TEST: ${{ inputs.telegram_test }}
        run: node tools/telegram.mjs
      - name: Save Telegram state
        if: always()
        run: |
          git add data/telegram.json
          git diff --cached --quiet || (git commit -m "Telegram posted [automated]" && git pull --rebase && git push)
